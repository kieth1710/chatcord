<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css">
  <title>JRU Health Consultation Portal</title>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-left">
        <i class="fas fa-heartbeat clinic-icon"></i>
        <h1>JRU Health Consultation</h1>
      </div>
      <div class="header-right">
        <a href="index.html" class="btn"><i class="fas fa-sign-out-alt"></i> End Session</a>
      </div>
    </header>
    <main class="chat-main">
      <div class="chat-sidebar">
        <div class="session-info">
          <h3><i class="fas fa-clinic-medical"></i> Service:</h3>
          <h2 id="room-name"></h2>
        </div>
        <div class="personnel">
          <h3><i class="fas fa-user-md"></i> Healthcare Team</h3>
          <ul id="users"></ul>
        </div>
        <div class="sidebar-info">
          <p>Your conversation is private and secure</p>
          <p>Need help? Call (555) 123-4567</p>
        </div>
      </div>
      <div class="chat-content">
        <div class="chat-messages"></div>
        <div class="typing-indicator" id="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </main>
    <div class="chat-form-container">
      <form id="chat-form">
        <input
          id="msg"
          name="msg"
          type="text"
          placeholder="Type your message here..."
          required
          autocomplete="off"
        />
        <button class="btn"><i class="fas fa-paper-plane"></i> Send</button>
      </form>
    </div>
    <footer class="chat-footer">
      <p>For emergencies, please visit the nearest hospital or call emergency services</p>
      <p>&copy; 2025 Jose Rizal University Medical Clinic</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.9.2/qs.min.js" integrity="sha512-f0AM6x08kthGzMyDHZjBgjBCPp8V8ovlHYCI1jMkhViTeX3MykGCf/DnN1khWss/6d1105eAG4TniSKy6UhZrw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
